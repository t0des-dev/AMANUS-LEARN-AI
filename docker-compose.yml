
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: amanus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amanus_learn_db}
      POSTGRES_USER: ${POSTGRES_USER:-amanus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amanus_password_secure}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amanus_user} -d ${POSTGRES_DB:-amanus_learn_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - amanus_network

  redis:
    image: redis:7-alpine
    container_name: amanus-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - amanus_network

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: amanus-minio
    restart: unless-stopped
    profiles: ["minio", "all", "default"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - amanus_network

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: amanus-api
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,api,web,nginx}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-amanus_user}:${POSTGRES_PASSWORD:-amanus_password_secure}@postgres:5432/${POSTGRES_DB:-amanus_learn_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - USE_MINIO=${USE_MINIO:-true}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./docs:/app/docs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amanus_network

  celery-default:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: amanus-celery-default
    restart: unless-stopped
    command: celery -A config worker -Q default -l info -n default@%h
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-amanus_user}:${POSTGRES_PASSWORD:-amanus_password_secure}@postgres:5432/${POSTGRES_DB:-amanus_learn_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./apps/api:/app/apps/api
      - ./workers:/app/workers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amanus_network

  celery-heavy:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: amanus-celery-heavy
    restart: unless-stopped
    command: celery -A config worker -Q heavy -l info -n heavy@%h
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-amanus_user}:${POSTGRES_PASSWORD:-amanus_password_secure}@postgres:5432/${POSTGRES_DB:-amanus_learn_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./apps/api:/app/apps/api
      - ./workers:/app/workers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amanus_network

  beat:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: amanus-beat
    restart: unless-stopped
    command: celery -A config beat -l info
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-amanus_user}:${POSTGRES_PASSWORD:-amanus_password_secure}@postgres:5432/${POSTGRES_DB:-amanus_learn_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./apps/api:/app/apps/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amanus_network

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: amanus-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-Amanus Learn AI}
      - PORT=3000
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - amanus_network

  nginx:
    image: nginx:alpine
    container_name: amanus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    networks:
      - amanus_network

networks:
  amanus_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:

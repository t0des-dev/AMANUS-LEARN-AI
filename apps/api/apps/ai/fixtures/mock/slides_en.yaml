slides:
- slide_number: 1
  title: Introduction to Neural Networks
  bullet_points:
  - Teaching deck grounded in the source document [1]
  - Audience: beginner-level learners
  - Goal: master the fundamental mechanisms
  speaker_notes: Welcome. We will explore key concepts taken straight from the

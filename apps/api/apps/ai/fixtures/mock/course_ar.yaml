title: 'مقرر شامل : الذكاء الاصطناعي ومعالجة البيانات'
description: برنامج تعليمي متكامل وشامل يغطي كافة جوانب المحتوى المستخرج من المصادر والوثائق.
level: BEGINNER
learning_objectives:
- فهم وتطبيق الأسس النظرية والمفاهيم الجوهرية
- تحليل النماذج والخوارزميات وآليات المعالجة
- تنفيذ مشاريع وتطبيقات عملية متوافقة مع متطلبات الأداء
chapters:
- title: 'الفصل 1 : المقدمة والمفاهيم النظرية التأسيسية'
  summary: مدخل منهجي شامل للمفاهيم الأساسية، المصطلحات والركائز المعرفية الأولية.
  estimated_minutes: 35
  sections:
  - title: 'الدرس 1.1 : الإطار المفاهيمي والمصطلحات الأساسية'
    content: '## مدخل إلى الإطار المفاهيمي


      يُشكل هذا المحور الركيزة الأساسية لفهم منظومة الذكاء الاصطناعي وهندسة البيانات. استناداً إلى الوثائق المرجعية، تتوزع المفاهيم المحورية على مبادئ التعلّم الآلي وهياكل النماذج [1].


      ### الركائز التأسيسية

      - **التعلم الخاضع للإشراف (Supervised Learning) :** يعتمد على بيانات مدربة وموسومة مسبقاً للوصول إلى دقة تنبؤ عالية [1].

      - **معالجة اللغات الطبيعية (NLP) :** تحويل النصوص غير المهيكلة إلى تمثيلات شعاعية قابلة للتحليل [2].


      > **ملاحظة منهجية :** يجب دائماً التحقق من جودة البيانات الخام قبل تغذيتها في خوارزميات التدريب لتفادي الانحياز الحسابي.'
    summary: استيعاب المصطلحات والركائز النظرية التأسيسية.
    objectives:
    - استيعاب المفاهيم الأولية بدقة
    - التمييز بين فئات التعلم الآلي
    estimated_minutes: 15
  - title: 'الدرس 1.2 : هياكل المعالجة والبيانات المرجعية'
    content: '## هيكلية تدفق البيانات


      تعتمد المعالجة الحديثة على تقسيم التدفق إلى مراحل متسلسلة تبدأ من الاستخراج والتنقية وصولاً إلى التغذية الراجعة [1].


      ### مراحل دورة حياة البيانات

      1. الاستخراج من المصادر المعتمدة.

      2. التنظيف واستبعاد القيم الشاذة والمتطرفة [2].

      3. التحويل القياسي (Normalization) للسمات والخصائص.


      > **تنبيه مهم :** يُعد التوثيق المستمر لمصادر البيانات شرطاً أساسياً لضمان قابلية التكرار والتدقيق الأكاديمي.'
    summary: إتقان خطوات تنقية وتحضير تدفقات البيانات.
    objectives:
    - تحديد متطلبات تنقية وتطبيع البيانات
    estimated_minutes: 20
- title: 'الفصل 2 : النماذج والخوارزميات وآليات العمل'
  summary: استعراض معمق لخوارزميات المحولات والانتباه وآليات التقييم.
  estimated_minutes: 40
  sections:
  - title: 'الدرس 2.1 : آلية الانتباه الذاتي ونماذج المحولات'
    content: '## آلية الانتباه الذاتي (Self-Attention)


      تُعد آلية الانتباه الذاتي القوة الدافعة خلف نماذج المحولات (Transformers) الحديثة، حيث تتيح حساب أوزان ديناميكية تمثل درجة الارتباط الدلالي بين الرموز في النص [1].


      ### المميزات الجوهرية

      - القدرة على المعالجة المتوازية للرموز بدلاً من التسلسل البطيء.

      - التقاط العلاقات السياقية طويلة المدى بدقة غير مسبوقة [2].


      > **قاعدة أساسية :** يتم قياس التفاعل عبر ضرب مصفوفات الاستعلام والمفتاح والقيمة وفق المعادلة القياسية الموزونة.'
    summary: فهم طريقة عمل آلية الانتباه والمحولات الحديثة.
    objectives:
    - فهم حسابات أوزان الانتباه الذاتي
    - مقارنة المحولات بالنماذج التكرارية
    estimated_minutes: 20
  - title: 'الدرس 2.2 : خوارزميات التحسين وضبط الأوزان'
    content: '## خوارزميات التدريب والتحسين


      يتم تدريب النماذج عبر تقليل دالة الخسارة باستخدام خوارزميات انحدار التدرج الحديثة مثل Adam و AdamW [2].


      ### معايير ضبط معاملات التدريب

      - **معدل التعلم (Learning Rate) :** القيمة المثلى تضمن التقارب السريع دون تشتت.

      - **حجم الدفعة (Batch Size) :** يؤثر مباشرة على استقرار التدرجات واستهلاك الذاكرة [1].'
    summary: معايير تحسين معاملات النماذج الحسابية.
    objectives:
    - إتقان ضبط معدل التعلم وحجم الدفعات
    estimated_minutes: 20
- title: 'الفصل 3 : المنهجية والبنية الهندسية للأنظمة'
  summary: تصميم معماريات الأنظمة الذكية، أنظمة الاسترجاع المعزز RAG وقواعد البيانات المتجهة.
  estimated_minutes: 45
  sections:
  - title: 'الدرس 3.1 : بنية الاسترجاع المعزز بالتوليد (RAG)'
    content: '## معمارية أنظمة RAG


      تجمع أنظمة RAG بين دقة استرجاع المستندات الموثوقة وقدرة النماذج التوليدية على صياغة إجابات مترابطة، مما يقضي على ظاهرة الهلوسة [1].


      ### المكونات الأساسية للنظام

      1. **مستودع الوثائق والتقطيع الدلالي (Semantic Chunking).**

      2. **فهارس المتجهات وقواعد بيانات pgvector [1].**

      3. **محرك إعادة الترتيب (Reranker) والتوليد المقيد بالمصادر [2].**


      > **أفضل ممارسة :** تطبيق البحث الهجين (Hybrid Search) الذي يدمج البحث النصي BM25 والبحث المتجهي لتحقيق أقصى درجات الدقة.'
    summary: تصميم وتنفيذ أنظمة RAG المتكاملة والآمنة.
    objectives:
    - هندسة أنظمة البحث الهجين والاسترجاع
    estimated_minutes: 25
  - title: 'الدرس 3.2 : إدارة المتجهات والفهرسة المتقدمة'
    content: '## استراتيجيات الفهرسة والتقطيع


      يُحدد حجم المقطع (Chunk Size) ونسبة التداخل (Overlap) جودة السياق المسترجع للنظام [1].


      ### التوصيات التقنية

      - المقاطع المتوسطة (500 إلى 800 حرف) تحافظ على وحدة المعنى.

      - استخدام نماذج تضمين متخصصة باللغة العربية لتحسين دقة التقارب الشعاعي [2].'
    summary: إتقان استراتيجيات تقطيع وفهرسة المحتوى.
    objectives:
    - اختيار المعايير المناسبة لتضمين النصوص
    estimated_minutes: 20
- title: 'الفصل 4 : التطبيقات العملية ودراسات الحالة'
  summary: سيناريوهات تطبيقية واقعية، بناء خطوط الأنابيب ومعالجة المشكلات الميدانية.
  estimated_minutes: 40
  sections:
  - title: 'الدرس 4.1 : بناء خط أنابيب معالجة المستندات عملياً'
    content: '## خطوات التنفيذ العملي


      تطبيق عملي لخط أنابيب الاستيعاب الشامل بدءاً من رفع ملفات PDF وحتى استخلاص النصوص عبر محرك OCR المتخصص [1].


      ### مراحل التنفيذ خطوة بخطوة

      1. فحص وسلامة الملف والتحقق من التنسيق السليم.

      2. التقطيع الدلالي وحساب تضمينات المتجهات المتزامنة [2].

      3. اختبار كفاءة الاستعلام عبر أمثلة واقعية.'
    summary: تنفيذ واختبار خط أنابيب متكامل لمعالجة الوثائق.
    objectives:
    - بناء خط أنابيب استيعاب كامل بنجاح
    estimated_minutes: 20
  - title: 'الدرس 4.2 : الأمان والعزل المتعدد في بيئات المؤسسات'
    content: '## متطلبات الأمان المؤسسي


      يتطلب نشر الأنظمة في بيئات العمل المشتركة تطبيق العزل المنطقي الكامل بين المنظمات ومراقبة الحصص الاستهلاكية بدقة [2].


      ### آليات الحماية

      - تحديد سقف الاستهلاك (Rate Limiting) عبر بوابات الـ API [1].

      - المعالجة غير المتزامنة للمهام الثقيلة عبر Celery.'
    summary: تطبيق قواعد الأمان والعزل متعدد المستأجرين.
    objectives:
    - تأمين الأنظمة وتطبيق العزل الصارم بين المنظمات
    estimated_minutes: 20
- title: 'الفصل 5 : التقييم وضمان الجودة والآفاق المستقبلية'
  summary: قياس دقة الاسترجاع، تفادي الهلوسة والتحسين المستمر للأنظمة.
  estimated_minutes: 35
  sections:
  - title: 'الدرس 5.1 : معايير التقييم الآلي والدقة المرجعية'
    content: '## معايير التقييم والقياس


      تعتمد موثوقية الأنظمة على مؤشرات كمية صارمة تشمل الأمانة للمصادر (Faithfulness) وملاءمة الإجابة (Relevance) [1].


      ### أهداف الجودة المعتمدة

      - نسبة الهلوسة: 0% للإجابات المرجعية.

      - زمن الاستجابة: أقل من ثانية واحدة للاستعلامات المخبأة [2].'
    summary: استخدام أدوات التقييم الآلي وقياس الأداء.
    objectives:
    - قياس مؤشرات دقة الإجابات والاسترجاع
    estimated_minutes: 15
  - title: 'الدرس 5.2 : الخلاصة الشاملة وخارطة طريق التعلم المستمر'
    content: '## الخلاصة والآفاق التطويرية


      يُشكل هذا المقرر دليلاً شاملاً لكافة الأسس والتقنيات الواردة في المستند المرجعي [1].


      ### أبرز المخرجات

      - الأنظمة المقيدة بالمصادر هي الأكثر موثوقية واستقراراً.

      - التصميم المعياري يضمن سهولة التحديث والتطوير المستمر [2].'
    summary: تلخيص شامل للمكتسبات المعرفية للدورة.
    objectives:
    - ترسيخ المكتسبات المعرفية وبناء خطة عمل مستقبلية
    estimated_minutes: 20
conclusion: خلاصة شاملة لكافة المحاور وتوصيات للتطبيق العملي.

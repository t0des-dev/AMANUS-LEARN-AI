slides:
- slide_number: 1
  title: مقدمة في شبكات العصبونات
  bullet_points:
  - عرض تعليمي مستند إلى الوثيقة المصدرية [1]
  - الجمهور: المتعلمون ở مستوى المبتدئين
  - الهدف: إتقان الآليات الأساسية
  speaker_notes: أهلاً بكم. سنستعرض المفاهيم الأساسية المأخوذة مباشرة من
    المستند المرفق.
- slide_number: 2
  title: جدول الأعمال
  bullet_points:
  - المبادئ الأساسية والتعريفات [1]
  - آليات الانتباه والترجيح [2]
  - التحسين والتدريب [3]
  - الخلاصة والنقاط الجوهرية
  speaker_notes: إليكم خطة جلستنا التعليمية.
- slide_number: 3
  title: المبادئ الأساسية
  bullet_points:
  - تنظم شبكة العصبونات وحدات الحساب في طبقات [1]
  - لكل اتصال وزن يتم تعلمه أثناء التدريب [1]
  - تُضِف دالة التنشيطية خاصية عدم الخطية للنموذج
  speaker_notes: ركزوا على مفهوم الأوزان والانتشار.
- slide_number: 4
  title: آلية الانتباه
  bullet_points:
  - ترجيح الانتباه لأهمية كل رمز لغوي [2]
  - يركز هذا الترجيح النموذج على السياق المفيد [2]
  - يُحسب الانتباه بالتوازي عبر التسلسل كاملاً [2]
  speaker_notes: قدّموا مثالاً عملياً على جملة محددة.
- slide_number: 5
  title: التحسين والتدريب
  bullet_points:
  - تحديث الأوزان عبر الانتشار العكسي والتنازل التدرجي [3]
  - تثبيت التوزيعات الداخلية عبر التطبيع [3]
  - يحدد معدل التعلم حجم التحديثات [3]
  speaker_notes: وضّحوا دور دالة الخسارة.
- slide_number: 6
  title: النقاط الجوهرية
  bullet_points:
  - تشفّر الأوزان المتعلمة معرفة النموذج [1]
  - يوجّه الانتباه التركيز السياقي [2]
  - يتقارب التحسين عبر الانتشار العكسي [3]
  speaker_notes: لخّصوا قبل الانتقال إلى الأسئلة.
- slide_number: 7
  title: الخاتمة والأسئلة والأجوبة
  bullet_points:
  - شكراً جزيلاً لحسن متابعتكم
  - نفتح المجال للأسئلة والنقاش
  - موارد إضافية متاحة عبر المنصة
  speaker_notes: افتحوا النقاش مع المتعلمين.

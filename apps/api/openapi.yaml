openapi: 3.0.3
info:
  title: Amanus Learn AI API
  version: 1.0.0
  description: Master API for SaaS EdTech / AI / RAG / LMS
paths:
  /api/v1/ai/query/:
    post:
      operationId: api_v1_ai_query_create
      description: |-
        POST /api/v1/rag/query/

        Executes complete RAG retrieval pipeline: hybrid/semantic/lexical search, re-ranking,
        grounded context generation, and structured citations.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/ai/search/:
    post:
      operationId: api_v1_ai_search_create
      description: |-
        POST /api/v1/rag/search/

        Semantic vector search with organization multi-tenant filtering,
        re-ranking, and structured provenance metadata.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/ai/tasks/{task_id}/:
    get:
      operationId: api_v1_ai_tasks_retrieve
      description: |-
        GET /api/v1/ai/tasks/{task_id}/ (and /api/v1/tasks/{task_id}/)

        Returns the unified lifecycle status, progress, duration, and result of any background generation task.
        Enforces strict multi-tenant authorization.
      parameters:
      - in: path
        name: task_id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/courses/{id}/:
    get:
      operationId: api_v1_analytics_courses_retrieve
      description: GET /api/v1/analytics/courses/{id}/ — Instructor course analytics
        (enrollment, progress, problematic chapters).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/courses/{id}/students/:
    get:
      operationId: api_v1_analytics_courses_students_retrieve
      description: GET /api/v1/analytics/courses/{id}/students/ — Per-student performance
        and study duration in a course.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/quizzes/{id}/:
    get:
      operationId: api_v1_analytics_quizzes_retrieve
      description: GET /api/v1/analytics/quizzes/{id}/ — Quiz analytics with difficult
        questions analysis.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/student/:
    get:
      operationId: api_v1_analytics_student_retrieve
      description: GET /api/v1/analytics/student/ — Student personal learning analytics.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/audio/{id}:
    get:
      operationId: api_v1_audio_retrieve
      description: |-
        GET    /api/v1/audio/{id} — Retrieve status, duration, script, and audio_url.

        DELETE /api/v1/audio/{id} — Delete audio record and remove audio file from storage.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: api_v1_audio_destroy
      description: |-
        GET    /api/v1/audio/{id} — Retrieve status, duration, script, and audio_url.

        DELETE /api/v1/audio/{id} — Delete audio record and remove audio file from storage.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/audio/{id}/:
    get:
      operationId: api_v1_audio_retrieve_2
      description: |-
        GET    /api/v1/audio/{id} — Retrieve status, duration, script, and audio_url.

        DELETE /api/v1/audio/{id} — Delete audio record and remove audio file from storage.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: api_v1_audio_destroy_2
      description: |-
        GET    /api/v1/audio/{id} — Retrieve status, duration, script, and audio_url.

        DELETE /api/v1/audio/{id} — Delete audio record and remove audio file from storage.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/audio/podcasts/:
    get:
      operationId: api_v1_audio_podcasts_retrieve
      description: |-
        GET  /api/v1/audio/podcasts/ - List user's organization podcast episodes.

        POST /api/v1/audio/podcasts/ - Generate a dynamic 2-voice educational podcast episode.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: api_v1_audio_podcasts_create
      description: |-
        GET  /api/v1/audio/podcasts/ - List user's organization podcast episodes.

        POST /api/v1/audio/podcasts/ - Generate a dynamic 2-voice educational podcast episode.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/audio/podcasts/{id}/:
    get:
      operationId: api_v1_audio_podcasts_retrieve_2
      description: |-
        GET    /api/v1/audio/podcasts/<id>/ - Retrieve episode with full dialogue turns.

        DELETE /api/v1/audio/podcasts/<id>/ - Delete episode.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: api_v1_audio_podcasts_destroy
      description: |-
        GET    /api/v1/audio/podcasts/<id>/ - Retrieve episode with full dialogue turns.

        DELETE /api/v1/audio/podcasts/<id>/ - Delete episode.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/audio/voices:
    get:
      operationId: api_v1_audio_voices_retrieve
      description: GET /api/v1/audio/voices — List available voices for VoiceSelector.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/audio/voices/:
    get:
      operationId: api_v1_audio_voices_retrieve_2
      description: GET /api/v1/audio/voices — List available voices for VoiceSelector.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/login:
    post:
      operationId: api_v1_auth_login_create
      description: Authenticates credentials and returns JWT access and refresh tokens.
      summary: User Login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                  access:
                    type: string
                  refresh:
                    type: string
          description: Authentication successful
        '400':
          description: Invalid credentials or inactive account
  /api/v1/auth/logout:
    post:
      operationId: api_v1_auth_logout_create
      description: Terminates the active user session and optionally revokes the refresh
        token.
      summary: User Logout
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Déconnexion réussie.
          description: Successfully logged out
  /api/v1/auth/me:
    get:
      operationId: api_v1_auth_me_retrieve
      description: Returns profile information for the currently authenticated user.
      summary: Get Current User Profile
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          description: Unauthorized
    patch:
      operationId: api_v1_auth_me_partial_update
      description: Allows updating partial details (first_name, last_name, avatar,
        language).
      summary: Update Current User Profile
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          description: Validation error
        '401':
          description: Unauthorized
  /api/v1/auth/refresh:
    post:
      operationId: api_v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register:
    post:
      operationId: api_v1_auth_register_create
      description: Creates a new user account and returns authentication tokens along
        with the user profile.
      summary: User Registration
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                  access:
                    type: string
                  refresh:
                    type: string
          description: Account created successfully
        '400':
          description: Validation error
  /api/v1/billing/audit-logs:
    get:
      operationId: api_v1_billing_audit_logs_list
      description: GET /billing/audit-logs - List audit trail logs for tenant admins.
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/billing/audit-logs/:
    get:
      operationId: api_v1_billing_audit_logs_list_2
      description: GET /billing/audit-logs - List audit trail logs for tenant admins.
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.

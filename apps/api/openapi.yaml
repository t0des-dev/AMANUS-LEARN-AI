  /api/v1/billing/subscription:
    get:
      operationId: api_v1_billing_subscription_retrieve
      description: Returns current contract, active plan, renewal date and status.
      summary: Get Subscription
      tags:
      - Billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
    post:
      operationId: api_v1_billing_subscription_create
      description: Upgrade, downgrade, or update active plan for organization.
      summary: Change Subscription Plan
      tags:
      - Billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePlan'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePlan'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePlan'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
  /api/v1/billing/subscription/:
    get:
      operationId: api_v1_billing_subscription_retrieve_2
      description: Returns current contract, active plan, renewal date and status.
      summary: Get Subscription
      tags:
      - Billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
    post:
      operationId: api_v1_billing_subscription_create_2

  /api/v1/billing/system/health:
    get:
      operationId: api_v1_billing_system_health_retrieve
      description: Deep diagnostics checking Database, Redis cache, and storage connectivity.
      summary: Production System Health Check
      tags:
      - System
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: System is healthy
        '503':
          description: One or more components are degraded
  /api/v1/billing/system/health/:

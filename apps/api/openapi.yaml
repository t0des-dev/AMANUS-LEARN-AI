      summary: List SaaS Plans
      tags:
      - Billing
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanDetails'
          description: ''
  /api/v1/billing/plan/:
    get:
      operationId: api_v1_billing_plan_list_2
      description: Returns tier details, limits, and quotas for FREE, PRO, BUSINESS,

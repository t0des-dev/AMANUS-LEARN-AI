          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatSessionCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatSessionCreate'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionCreate'
          description: ''
  /api/v1/chat/sessions/:
    get:
      operationId: api_v1_chat_sessions_list_2
      description: |-

  /api/v1/chat/sessions/{id}:
    get:
      operationId: api_v1_chat_sessions_retrieve
      description: |-
        GET    /api/v1/chat/sessions/{id} — Retrieve session details and messages.

        PATCH  /api/v1/chat/sessions/{id} — Update session title or scope.
        DELETE /api/v1/chat/sessions/{id} — Delete conversation.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionDetail'
          description: ''
    put:
      operationId: api_v1_chat_sessions_update
      description: |-
        GET    /api/v1/chat/sessions/{id} — Retrieve session details and messages.

        PATCH  /api/v1/chat/sessions/{id} — Update session title or scope.
        DELETE /api/v1/chat/sessions/{id} — Delete conversation.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSessionDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatSessionDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatSessionDetail'
      security:

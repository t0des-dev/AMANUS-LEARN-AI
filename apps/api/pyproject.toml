[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "**/migrations/*",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["ALL"]
"config/settings/*" = ["F403", "F405"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin", "mypy_plugin"]
ignore_missing_imports = true
exclude = ["(?x)(^|/)migrations/|\\.venv/|__pycache__/"]
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "config.settings.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "apps.*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

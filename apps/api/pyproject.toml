[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "**/migrations/*",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["ALL"]
"config/settings/*" = ["F403", "F405"]

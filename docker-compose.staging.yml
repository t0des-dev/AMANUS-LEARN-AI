# ==============================================================================
# Amanus Learn AI - Staging Docker Compose Architecture
# Exact architectural parity with Production, isolated resources & networks
# ==============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: amanus-staging-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amanus_staging_db}
      POSTGRES_USER: ${POSTGRES_USER:-amanus_staging_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Staging database password required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amanus_staging_user} -d ${POSTGRES_DB:-amanus_staging_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - amanus_staging_network
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: amanus-staging-redis
    restart: always
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-staging_redis_password_secure}
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-staging_redis_password_secure}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-staging_redis_password_secure}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amanus_staging_network

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: amanus-staging-api
    restart: always
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 2
      --threads 4
      --worker-class gthread
      --worker-tmp-dir /dev/shm
      --max-requests 1000
      --max-requests-jitter 100
      --timeout 300
      --graceful-timeout 30
      --keep-alive 65
      --access-logfile -
      --error-logfile -
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.staging
      - ENVIRONMENT=staging
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?Staging secret key required}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-staging.amanuslearn.com,api-staging.amanuslearn.com,localhost,api,web,nginx}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-amanus_staging_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-amanus_staging_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-staging_redis_password_secure}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-staging_redis_password_secure}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-staging_redis_password_secure}@redis:6379/1
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://staging.amanuslearn.com}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://staging.amanuslearn.com,https://api-staging.amanuslearn.com}
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - static_staging_volume:/app/apps/api/staticfiles
      - media_staging_volume:/app/apps/api/media
      - ./logs/staging:/app/apps/api/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amanus_staging_network

  celery-default:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: amanus-staging-celery-default
    restart: always
    command: celery -A config worker -Q default --concurrency=2 -l info -n default-staging@%h
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.staging
      - ENVIRONMENT=staging
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-amanus_staging_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-amanus_staging_db}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-staging_redis_password_secure}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-staging_redis_password_secure}@redis:6379/1
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - media_staging_volume:/app/apps/api/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amanus_staging_network
    deploy:
      resources:
        limits:
          memory: 1G

  celery-heavy:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: amanus-staging-celery-heavy
    restart: always
    command: celery -A config worker -Q heavy --concurrency=1 -l info -n heavy-staging@%h
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.staging
      - ENVIRONMENT=staging
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-amanus_staging_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-amanus_staging_db}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-staging_redis_password_secure}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-staging_redis_password_secure}@redis:6379/1
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - media_staging_volume:/app/apps/api/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amanus_staging_network
    deploy:
      resources:
        limits:
          memory: 1.5G

  beat:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: amanus-staging-beat
    restart: always
    command: celery -A config beat -l info --pidfile=/tmp/celerybeat-staging.pid
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.staging
      - ENVIRONMENT=staging
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-amanus_staging_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-amanus_staging_db}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-staging_redis_password_secure}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-staging_redis_password_secure}@redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amanus_staging_network

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: amanus-staging-web
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://staging.amanuslearn.com/api/v1}
      - NEXT_PUBLIC_APP_NAME="Amanus Learn AI (Staging)"
      - PORT=3000
    depends_on:
      - api
    networks:
      - amanus_staging_network

  nginx:
    image: nginx:1.25-alpine
    container_name: amanus-staging-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "3030:3030"
    volumes:
      - ./infrastructure/nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_staging_volume:/var/www/certbot:ro
      - static_staging_volume:/var/www/static:ro
      - media_staging_volume:/var/www/media:ro
    depends_on:
      - api
      - web
    networks:
      - amanus_staging_network

  certbot:
    image: certbot/certbot:latest
    container_name: amanus-staging-certbot
    restart: always
    volumes:
      - ./infrastructure/nginx/ssl:/etc/letsencrypt
      - certbot_staging_volume:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - amanus_staging_network

networks:
  amanus_staging_network:
    driver: bridge

volumes:
  postgres_staging_data:
  redis_staging_data:
  static_staging_volume:
  media_staging_volume:
  certbot_staging_volume:

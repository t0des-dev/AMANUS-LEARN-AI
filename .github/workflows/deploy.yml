name: CD / Automated Deployment Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_backup:
        description: 'Skip Pre-deploy Backup (Emergency only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  pre-deploy-validation:
    name: Validate Quality Gates Before Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Fast System Check
        run: |
          cd apps/api
          python manage.py check

      - name: Missing Migration Check
        run: |
          cd apps/api
          python manage.py makemigrations --check --dry-run

  build-and-publish:
    name: Build & Publish Container Images
    needs: pre-deploy-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/api
            ghcr.io/${{ github.repository }}/web
            ghcr.io/${{ github.repository }}/worker
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: false  # In actual deployment with repo token, set push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}

      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.worker
          push: false
          tags: ghcr.io/${{ github.repository }}/worker:${{ github.sha }}

      - name: Build Web Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.web
          push: false
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }}

  deploy:
    name: Zero-Downtime Rollout
    needs: [pre-deploy-validation, build-and-publish]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
      url: ${{ (github.event.inputs.environment == 'production') && 'https://app.amanuslearn.com' || 'https://staging.amanuslearn.com' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Execution Orchestration
        run: |
          TARGET_ENV="${{ github.event.inputs.environment || 'staging' }}"
          echo "================================================================="
          echo "==> Deploying Amanus Learn AI to [$TARGET_ENV]"
          echo "==> Target Commit: ${{ github.sha }}"
          echo "==> Ref: ${{ github.ref }}"
          echo "================================================================="
          # When deploying to a live VPS/host, SSH or webhook runner executes:
          # ssh user@host "cd /opt/amanus-learn-ai && ./infrastructure/scripts/deploy.sh $TARGET_ENV"
          echo "Deployment script validated: ./infrastructure/scripts/deploy.sh $TARGET_ENV"
          chmod +x infrastructure/scripts/*.sh

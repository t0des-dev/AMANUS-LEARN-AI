version: '3.9'

# ==============================================================================
# Amanus Learn AI - Production Docker Compose Architecture (Sprint 14)
# ==============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: amanus-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amanus_learn_db}
      POSTGRES_USER: ${POSTGRES_USER:-amanus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amanus_user} -d ${POSTGRES_DB:-amanus_learn_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - amanus_prod_network
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: amanus-prod-redis
    restart: always
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-secure_redis_password}"
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secure_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amanus_prod_network

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: amanus-prod-api
    restart: always
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --threads 8
      --worker-class gthread
      --worker-tmp-dir /dev/shm
      --max-requests 1000
      --max-requests-jitter 100
      --timeout 300
      --graceful-timeout 30
      --keep-alive 65
      --access-logfile -
      --error-logfile -
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - ENVIRONMENT=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?Production secret key required}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-app.amanuslearn.com,localhost,api,web,nginx}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-amanus_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-amanus_learn_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-secure_redis_password}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-secure_redis_password}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-secure_redis_password}@redis:6379/1
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://app.amanuslearn.com}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://app.amanuslearn.com}
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - static_volume:/app/apps/api/staticfiles
      - media_volume:/app/apps/api/media
      - ./logs:/app/apps/api/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amanus_prod_network

  celery-default:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: amanus-prod-celery-default
    restart: always
    command: celery -A config worker -Q default --concurrency=4 -l info -n default@%h
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - ENVIRONMENT=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-amanus_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-amanus_learn_db}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-secure_redis_password}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-secure_redis_password}@redis:6379/1
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - media_volume:/app/apps/api/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amanus_prod_network
    deploy:
      resources:
        limits:
          memory: 1G

  celery-heavy:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: amanus-prod-celery-heavy
    restart: always
    command: celery -A config worker -Q heavy --concurrency=2 -l info -n heavy@%h
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - ENVIRONMENT=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-amanus_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-amanus_learn_db}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-secure_redis_password}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-secure_redis_password}@redis:6379/1
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - media_volume:/app/apps/api/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amanus_prod_network
    deploy:
      resources:
        limits:
          memory: 2G

  beat:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: amanus-prod-beat
    restart: always
    command: celery -A config beat -l info --pidfile=/tmp/celerybeat.pid
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - ENVIRONMENT=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-amanus_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-amanus_learn_db}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-secure_redis_password}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-secure_redis_password}@redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amanus_prod_network

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: amanus-prod-web
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://app.amanuslearn.com/api/v1}
      - NEXT_PUBLIC_APP_NAME=Amanus Learn AI
      - PORT=3000
    depends_on:
      - api
    networks:
      - amanus_prod_network

  nginx:
    image: nginx:1.25-alpine
    container_name: amanus-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_volume:/var/www/certbot:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      - api
      - web
    networks:
      - amanus_prod_network

  certbot:
    image: certbot/certbot:latest
    container_name: amanus-prod-certbot
    restart: always
    volumes:
      - ./infrastructure/nginx/ssl:/etc/letsencrypt
      - certbot_volume:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - amanus_prod_network

networks:
  amanus_prod_network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  static_volume:
  media_volume:
  certbot_volume:

# ==============================================================================
# Amanus Learn AI - Staging Nginx Configuration
# Exact architectural parity with Production, targeting staging domains
# ==============================================================================

limit_req_zone $binary_remote_addr zone=staging_api_rate_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=staging_auth_rate_limit:10m rate=10r/s;

upstream staging_backend_api {
    server api:8000;
    keepalive 32;
}

upstream staging_frontend_web {
    server web:3000;
    keepalive 32;
}

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name staging.amanuslearn.com api-staging.amanuslearn.com localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Staging HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.amanuslearn.com api-staging.amanuslearn.com localhost;

    ssl_certificate /etc/nginx/ssl/live/staging.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/staging.privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 100M;
    client_body_buffer_size 128k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript font/woff2;

    # Static Assets Cache
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Media Uploads
    location /media/ {
        alias /var/www/media/;
        expires 3d;
        add_header Cache-Control "private, max-age=259200";
        location ~ \.(php|py|sh|pl|cgi)$ {
            deny all;
        }
    }

    # API Authentication Endpoints
    location ~* ^/api/v1/auth/ {
        limit_req zone=staging_auth_rate_limit burst=15 nodelay;
        proxy_pass http://staging_backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Real-Time SSE Chat Streaming Endpoints
    location ~* ^/api/v1/chat/sessions/[^/]+/messages {
        limit_req zone=staging_api_rate_limit burst=60 nodelay;
        proxy_pass http://staging_backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # API & SaaS Billing Endpoints
    location ~* ^/(api|billing|system|admin) {
        limit_req zone=staging_api_rate_limit burst=60 nodelay;
        proxy_pass http://staging_backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # Next.js Frontend Web Application
    location / {
        proxy_pass http://staging_frontend_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
